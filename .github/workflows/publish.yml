name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # IODC write permission
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm publish --access public --provenance # Provenance adds the "secure" badge
